[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qrmlib"
version = "0.7.0"
description = "FinTech 545 Quantitative Risk Management library (Assignments 1-2 + Weeks 3-5 midterm tools)"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scipy", "matplotlib"]

[project.optional-dependencies]
timeseries = ["statsmodels"]
test = ["pytest"]

[tool.setuptools]
packages = ["qrmlib"]
